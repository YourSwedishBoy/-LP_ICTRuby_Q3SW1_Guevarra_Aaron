<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace; /* Retro font */
            background-color: #f1f1f1;
            color: #333;
            text-align: center;
            padding: 50px;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('https://www.transparenttextures.com/patterns/asfalt.png');
            background-size: 100%;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #dcdcdc;
            width: 350px;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            font-size: 18px;
        }
        h1 {
            color: #2f4f4f;
            margin-bottom: 30px;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        label {
            font-size: 16px;
            margin-right: 10px;
            color: #333;
            display: inline-block;
            margin-top: 15px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 100px;
            margin-right: 10px;
            border: 2px solid #aaa;
            border-radius: 5px;
            background-color: #fafafa;
            color: #333;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #8b4513; 
            color: white;
            border: 2px solid #8b4513;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
        }
        button:hover {
            background-color: #5c2f0d; 
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
            font-family: 'Courier New', Courier, monospace;
        }
        hr {
            border: 1px solid #dcdcdc;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Currency Converter</h1>
        

        <div>
            <label for="pesos-usd">Pesos to USD:</label>
            <input type="number" id="pesos-usd" value="100" min="0" />
            <button onclick="convertToUsd()">Convert</button>
        </div>
        <p class="result" id="usd-result">USD: </p>

        <hr>


        <div>
            <label for="pesos-thb">Pesos to THB:</label>
            <input type="number" id="pesos-thb" value="100" min="0" />
            <button onclick="convertToThb()">Convert</button>
        </div>
        <p class="result" id="thb-result">THB: </p>
    </div>

    <script>
 
        const pesoToUsdRate = 0.018; 
        const pesoToThbRate = 0.59; 

  
        function convertToUsd() {
            const pesos = parseFloat(document.getElementById('pesos-usd').value);
            const usd = pesos * pesoToUsdRate;
            document.getElementById('usd-result').textContent = "USD: " + usd.toFixed(2);
        }


        function convertToThb() {
            const pesos = parseFloat(document.getElementById('pesos-thb').value);
            const thb = pesos * pesoToThbRate;
            document.getElementById('thb-result').textContent = "THB: " + thb.toFixed(2);
        }
    </script>

</body>
</html>
